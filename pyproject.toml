[project]
name = "red-arch-km"
version = "2.0.0"
description = "Red Arch Knowledge Management Platform"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
]
exclude = [
    # Go modules matched by the globs above but not uv (Python) members.
    "packages/accessmask",
    "packages/shared",
    "services/api-go",
    "services/brain-api-go",
    "services/worker-go",
]

[tool.uv.sources]
access-mask = { workspace = true }
shared-config = { workspace = true }
brain-sdk = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "SIM", # flake8-simplify
]
ignore = [
    "S101", # allow assert in tests
]

[tool.ruff.lint.per-file-ignores]
# S105/S106 flag hardcoded credentials. Tests assign dummy tokens by design
# ("at", "refresh-1"); real secrets are caught by gitleaks, which scans every
# file regardless of these ignores.
"**/tests/**" = ["S101", "S105", "S106"]
# Standalone CLI tools — stdout is their interface, not a stray debug print.
"scripts/**" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# Test suites use a non-unique module layout — multiple top-level `conftest.py`
# and `tests/integration/__init__.py` across packages — that mypy cannot resolve
# without `--explicit-package-bases`, which in turn breaks src-layout product
# module resolution (it would re-discover e.g. `api.models.base` under a second
# path-derived name and report spurious duplicate-class errors). Tests are not
# part of the typed product surface, and the standalone scripts below are not
# imported by product code, so both are excluded from the type gate.
#
# Alembic revisions join them: they are append-only history, largely generated,
# and full of untyped `op.*` boilerplate. Annotating them would mean editing
# migrations that have already run in production for no runtime benefit.
exclude = '(/tests/|/alembic/versions/|/alembic/env\.py$|/scripts/seed_e2e\.py$)'

[[tool.mypy.overrides]]
# Typing debt, not policy. `strict` applies everywhere; these modules predate the
# gate ever running (lint-and-type-check always failed at ruff first, so mypy was
# never reached) and carry only cosmetic findings — missing generic parameters,
# unannotated internals, Any-returns. Every correctness-class error (arg-type,
# union-attr, operator, assignment) was fixed rather than listed here.
#
# This list is a ratchet: it may shrink, never grow. Annotate a module, drop its
# line. New modules are checked strictly from the start.
module = [
    "api.models.agent",  # 4: type-arg
    "api.models.agent_run",  # 4: type-arg
    "api.models.mcp_server",  # 1: type-arg
    "api.models.workflow",  # 2: no-untyped-call
    "api.repositories.agent_run",  # 2: type-arg
    "api.repositories.dynamic_entity",  # 4: type-arg, valid-type
    "api.routers.admin",  # 1: misc
    "api.routers.forms",  # 2: return
    "api.routers.views",  # 1: return
    "api.schemas.agent",  # 4: type-arg
    "api.schemas.agent_run",  # 2: type-arg
    "api.schemas.form_elements",  # 2: no-untyped-def
    "api.services.agent",  # 2: call-overload
    "api.services.agents.console",  # 3: no-untyped-def, type-arg
    "api.services.agents.mcp.client",  # 2: misc, no-untyped-def
    "api.services.agents.mcp.oauth",  # 1: no-untyped-def
    "api.services.agents.mcp.oauth_service",  # 3: no-untyped-def, type-arg
    "api.services.agents.mcp.registry",  # 2: no-untyped-def
    "api.services.agents.run_executor",  # 2: no-untyped-def, type-arg
    "api.services.agents.runtime",  # 3: no-untyped-call, no-untyped-def
    "api.services.agents.scheduler",  # 1: no-any-return
    "api.services.agents.tools.loader",  # 1: no-untyped-def
    "api.services.agents.tools.web_research",  # 1: var-annotated
    "api.services.agents.work_order_service",  # 1: type-arg
    "api.services.form_expression",  # 6: no-any-return
    "api.services.form_layout",  # 2: no-redef
    "api.services.identifiers",  # 2: no-untyped-call, return-value
    "api.services.llm_decide",  # 1: no-any-return
    "api.services.migration.diff",  # 14: type-arg
    "api.services.migration.importer",  # 30: no-any-return, type-arg
    "api.services.migration.promotion",  # 1: no-any-return
    "api.services.migration.transport",  # 2: type-arg
    "api.services.report_service",  # 1: var-annotated
    "api.services.schema_manager",  # 4: no-any-return, no-untyped-call, type-arg
    "api.services.workflow.dispatcher",  # 3: no-any-return
    "api.services.workflow.jsonlogic",  # 2: no-any-return
    "api.services.workflow.validation",  # 8: no-any-return, no-untyped-def, type-arg
    "worker.extract.docx",  # 1: no-any-return
    "worker.extract.tesseract",  # 1: no-any-return
]
disable_error_code = [
    "call-overload",
    "misc",
    "no-any-return",
    "no-redef",
    "no-untyped-call",
    "no-untyped-def",
    "return",
    "return-value",
    "type-arg",
    "valid-type",
    "var-annotated",
]

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
asyncio_mode = "auto"
# The API integration suite uses a session-scoped async engine fixture shared by
# per-function session fixtures. pytest-asyncio>=1.x defaults to a fresh event loop
# per function, which puts the engine and the tests on different loops → asyncpg
# "another operation is in progress" / "Future attached to a different loop". These
# loop scopes (mirrored from services/api/pyproject.toml) pin everything to one loop.
# The per-package pyproject value only applies when pytest is invoked inside that
# package; the CI gate runs from the repo root, so the root config must set them too.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# `importlib` import mode gives every test module a unique, fully-qualified name
# derived from its path relative to the rootdir. The default `prepend` mode
# instead derives the package name by walking up while `__init__.py` files exist,
# which mapped both services/api/tests/integration and services/brain_api/tests/
# integration to the bare package `integration` → a deterministic
# ImportPathMismatchError that aborted the whole collection. importlib mode
# requires that test directories NOT carry `__init__.py` (those truncate the
# derived name back to the colliding bare package), so the empty marker files
# under services/*/tests/** were removed alongside this change.
addopts = "--import-mode=importlib"
markers = [
    "unit: unit tests",
    "integration: integration tests requiring external services",
]
