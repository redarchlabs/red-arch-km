<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Starship with all systems nominal">
  <title>All systems nominal</title>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#050813"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8edf7"/>
      <stop offset="55%" stop-color="#b9c4d8"/>
      <stop offset="100%" stop-color="#7d8899"/>
    </linearGradient>
    <linearGradient id="hullDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa6ba"/>
      <stop offset="100%" stop-color="#5c6675"/>
    </linearGradient>
    <radialGradient id="engineGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ff0ff" stop-opacity="1"/>
      <stop offset="45%" stop-color="#31b7ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0a6ed1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shield" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#39d4ff" stop-opacity="0"/>
      <stop offset="92%" stop-color="#39d4ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8ef1ff" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#space)"/>
  <g fill="#ffffff">
    <circle cx="90" cy="80" r="2.4" opacity=".9"/><circle cx="240" cy="150" r="1.6" opacity=".6"/>
    <circle cx="410" cy="60" r="2" opacity=".8"/><circle cx="620" cy="110" r="1.4" opacity=".5"/>
    <circle cx="800" cy="70" r="2.2" opacity=".85"/><circle cx="980" cy="140" r="1.7" opacity=".6"/>
    <circle cx="1120" cy="60" r="2" opacity=".75"/><circle cx="150" cy="470" r="1.8" opacity=".7"/>
    <circle cx="330" cy="540" r="2.3" opacity=".8"/><circle cx="560" cy="500" r="1.5" opacity=".55"/>
    <circle cx="760" cy="545" r="2" opacity=".7"/><circle cx="1010" cy="470" r="1.6" opacity=".6"/>
    <circle cx="1150" cy="520" r="2.2" opacity=".8"/><circle cx="60" cy="300" r="1.5" opacity=".5"/>
  </g>

  <!-- shield envelope: intact -->
  <ellipse cx="600" cy="300" rx="470" ry="215" fill="url(#shield)"/>
  <ellipse cx="600" cy="300" rx="470" ry="215" fill="none" stroke="#8ef1ff" stroke-opacity=".55" stroke-width="3"/>

  <!-- engine exhaust -->
  <g>
    <ellipse cx="205" cy="300" rx="150" ry="52" fill="url(#engineGlow)"/>
    <ellipse cx="248" cy="300" rx="70" ry="26" fill="#bff4ff" opacity=".85"/>
  </g>

  <!-- ship -->
  <g>
    <!-- main hull -->
    <path d="M295 300 L360 250 L860 236 Q980 250 1015 300 Q980 350 860 364 L360 350 Z" fill="url(#hull)" stroke="#39414f" stroke-width="4"/>
    <!-- nose cone -->
    <path d="M1008 276 Q1090 288 1132 300 Q1090 312 1008 324 Z" fill="#dfe6f2" stroke="#39414f" stroke-width="3"/>
    <!-- upper fin -->
    <path d="M520 244 L565 140 L640 152 L660 240 Z" fill="url(#hullDark)" stroke="#39414f" stroke-width="4"/>
    <!-- lower fin -->
    <path d="M520 356 L565 460 L640 448 L660 360 Z" fill="url(#hullDark)" stroke="#39414f" stroke-width="4"/>
    <!-- engine block -->
    <rect x="295" y="262" width="70" height="76" rx="12" fill="#5c6675" stroke="#39414f" stroke-width="4"/>
    <rect x="308" y="278" width="42" height="44" rx="8" fill="#8ff0ff" opacity=".9"/>
    <!-- hull stripe -->
    <path d="M370 300 L1000 300" stroke="#e2372f" stroke-width="8" stroke-linecap="round" opacity=".85"/>
    <!-- windows -->
    <g fill="#ffe98a" stroke="#39414f" stroke-width="2">
      <circle cx="905" cy="288" r="15"/><circle cx="855" cy="284" r="11"/><circle cx="805" cy="282" r="11"/>
      <circle cx="755" cy="281" r="11"/>
    </g>
    <!-- panel lines -->
    <g stroke="#8c97a8" stroke-width="3" opacity=".8">
      <path d="M430 256 L430 344"/><path d="M700 246 L700 354"/><path d="M840 240 L840 360"/>
    </g>
    <!-- running lights: green = nominal -->
    <g fill="#4ade80">
      <circle cx="600" cy="243" r="9"/><circle cx="600" cy="357" r="9"/>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="600" y="545" fill="#8ef1ff" font-size="30" text-anchor="middle" letter-spacing="6">ALL SYSTEMS NOMINAL</text>
  </g>
</svg>
