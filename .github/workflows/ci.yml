name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-packages --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy packages/ services/ --ignore-missing-imports

  test-python:
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    services:
      postgres:
        # Matches the docker-compose.infra.yml pin for dev parity.
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_km
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-packages --extra dev --dev
      - name: Run tests
        run: uv run pytest --tb=short --cov=packages --cov=services --cov-report=xml --cov-fail-under=80
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_km
          REDIS_URL: redis://localhost:6379/0
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
        if: always()

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run Go tests (race + cover)
        run: >-
          go test -race -cover
          ./packages/accessmask/... ./packages/shared/...
          ./services/api-go/... ./services/worker-go/...
          ./services/brain-api-go/...

  test-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun run lint
      - run: bun run test

  test-e2e:
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      # Playwright boots the Next dev server, which refuses to start without a
      # Clerk publishable key, and /login only finishes rendering once Clerk's
      # browser bundle loads from the instance encoded in that key — so a dummy
      # value is not enough. Rather than fail every run, the job announces itself
      # as unconfigured and stops.
      #
      # The annotation is deliberate: this job was previously gated behind
      # lint-and-type-check and sat in "skipped" for months, which is how a
      # non-collecting test suite and 8 broken tests went unnoticed. A silent
      # skip is the failure mode being avoided here, so make it loud.
      #
      # To enable:  gh variable set CLERK_PUBLISHABLE_KEY --body 'pk_test_...'
      #             gh secret   set CLERK_SECRET_KEY      --body 'sk_test_...'
      - name: Check Clerk configuration
        id: clerk
        run: |
          if [ -n "${{ vars.CLERK_PUBLISHABLE_KEY }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=E2E tests did not run::CLERK_PUBLISHABLE_KEY is not configured, so the browser smoke tests were skipped. Set the repo variable to enable them."
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.clerk.outputs.configured == 'true'
        with:
          bun-version: "1.3.11"
      - if: steps.clerk.outputs.configured == 'true'
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        if: steps.clerk.outputs.configured == 'true'
        run: bunx playwright install --with-deps
      - name: Run Playwright smoke tests
        if: steps.clerk.outputs.configured == 'true'
        run: bun run test:e2e
        # Note: E2E_WITH_BACKEND is unset, so test.skip() guards fire correctly
        # BASE_URL is unset, so playwright.config.ts boots the dev server
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      - name: Upload Playwright report
        if: always() && steps.clerk.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 30
